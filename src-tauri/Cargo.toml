[package]
name = "cancioneiro"
version = "0.1.0"
description = "Cancioneiro — player offline com busca por letra"
authors = ["Avantsoft"]
edition = "2021"

[lib]
name = "cancioneiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
walkdir = "2"

[dev-dependencies]
tempfile = "3"
