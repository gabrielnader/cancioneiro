[package]
name = "cancioneiro"
version = "0.4.0"
description = "Cancioneiro — player offline com busca por letra"
authors = ["Avantsoft"]
edition = "2021"

[lib]
name = "cancioneiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# V7/F16 — atualização automática. Consulta o manifesto da release no GitHub e
# valida a assinatura minisign (chave pública em tauri.conf.json).
tauri-plugin-updater = "2"
# só para o "Reiniciar agora" do aviso de atualização (relaunch)
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
walkdir = "2"
# usado SOMENTE pelo comando fetch_lyrics_online (único ponto de rede do app)
ureq = { version = "2", features = ["tls"] }

[dev-dependencies]
tempfile = "3"
