[package]
name = "cancioneiro"
version = "0.12.0"
description = "Cancioneiro — player offline com busca por letra"
authors = ["Avantsoft"]
edition = "2021"

[lib]
name = "cancioneiro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
# V7/F16 — atualização automática. Consulta o manifesto da release no GitHub e
# valida a assinatura minisign (chave pública em tauri.conf.json).
tauri-plugin-updater = "2"
# só para o "Reiniciar agora" do aviso de atualização (relaunch)
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lofty = "0.22"
rusqlite = { version = "0.32", features = ["bundled", "collation"] }
walkdir = "2"
# usado SOMENTE pelos pontos de rede enumerados do app (funil de curadoria e
# download de acessórios) — ver commands.rs
ureq = { version = "2", features = ["tls"] }
# V9/F18 fase 2 — conferência do SHA-256 dos acessórios ANTES de executá-los.
# Implementação de terceiros de propósito: hash é primitiva de segurança, e
# escrever a nossa daria uma linha de defesa auditada por uma pessoa só. A
# crate já estava na árvore como dependência transitiva do Tauri.
sha2 = "0.10"
# V10 — a etapa 5 DECODIFICA o MP3 aqui dentro e entrega ao whisper-cli um WAV
# 16 kHz mono, que é o único formato que ele lê com certeza em todas as
# plataformas (ele só decodifica outros quando compilado com ffmpeg, o que é
# opção de Linux e brigaria com o `BUILD_SHARED_LIBS=OFF` que faz do acessório
# UM arquivo conferível). Escolhido por ser PURO RUST: nenhuma biblioteca de
# sistema, nenhum compilador C, o mesmo código nas quatro plataformas que o CI
# constrói — um `minimp3` (binding C) precisaria de toolchain por plataforma.
# Só a feature `mp3` (mais `id3v2`, para o leitor pular a tag do começo do
# arquivo): sem wav, flac, ogg, mkv, vorbis, adpcm, pcm nem o resto dos
# metadados. Licença MPL-2.0 (copyleft por ARQUIVO — não contamina o
# aplicativo; obriga a publicar modificações nos arquivos dela, e não fazemos
# nenhuma).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "id3v2"] }

[dev-dependencies]
tempfile = "3"
