name: release

# Publica instaladores Windows (.msi/.exe), macOS (.dmg, Intel e Apple Silicon)
# e Linux (.deb/.AppImage) em GitHub Releases a cada tag v*.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências npm
        run: npm ci

      - name: Build e publicação na release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Cancioneiro ${{ github.ref_name }}"
          releaseBody: |
            Instaladores do Cancioneiro — player offline com busca por letra e temas.

            - **Windows**: `.msi` ou `.exe` (SmartScreen: "Mais informações" → "Executar assim mesmo")
            - **macOS**: `.dmg` — `aarch64` para Apple Silicon (M1+), `x64` para Intel
              (primeira abertura: botão direito → "Abrir", app não assinado)
            - **Linux**: `.deb` ou `.AppImage`

            Guia de uso e curadoria do acervo: README.md do repositório.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
