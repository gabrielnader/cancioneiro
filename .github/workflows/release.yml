name: release

# Publica instaladores Windows (.msi/.exe), macOS (.dmg, Intel e Apple Silicon)
# e Linux (.deb/.AppImage) em GitHub Releases a cada tag v*.
on:
  push:
    tags: ["v*"]
  # disparo manual (a tag/release é criada pelo tauri-action)
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag da release (ex.: v0.2.0)"
        required: true
        default: "v0.2.0"

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Dependências npm
        run: npm ci

      - name: A tag tem de bater com a versão do aplicativo
        # O `latest.json` sai com a versão do tauri.conf.json, NÃO com a tag.
        # Taguear v0.9.0 esquecendo o bump publica um manifesto dizendo 0.8.1,
        # o updater compara 0.8.1 > 0.8.1, dá falso, e a release fica
        # publicada e INVISÍVEL: ninguém atualiza e ninguém percebe, porque
        # não há suporte a quem perguntar. Aconteceu na v0.9.0 e só não saiu
        # porque o QA pegou. Lembrança não é mecanismo.
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          versao=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tag=$tag  tauri.conf.json=$versao"
          if [ "$tag" != "v$versao" ]; then
            echo "::error::a tag ($tag) não corresponde à versão do aplicativo (v$versao)."
            echo "::error::atualize package.json, src-tauri/tauri.conf.json e src-tauri/Cargo.toml antes de publicar."
            exit 1
          fi
          for arquivo in package.json src-tauri/Cargo.toml; do
            grep -q "$versao" "$arquivo" || {
              echo "::error::$arquivo não está na versão $versao"; exit 1; }
          done

      - name: Build e publicação na release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # V9/PRD §2 — as chaves das etapas de rede entram no BINÁRIO em
          # tempo de compilação, via `option_env!`. Segredo de repositório não
          # vira variável de ambiente sozinho: sem estas duas linhas o
          # `option_env!` devolve None e a etapa some — a v0.9.0 inteira
          # (máquina de acessórios + etapa do som) nasceria inerte, e nenhuma
          # suíte veria, porque todas injetam a chave nos testes.
          #
          # Ausente = etapa pulada em silêncio, que é o comportamento correto
          # para build de desenvolvimento e para fork. O que NÃO pode é a tela
          # prometer uma etapa que esta build não tem.
          ACOUSTID_API_KEY: ${{ secrets.ACOUSTID_API_KEY }}
          VAGALUME_API_KEY: ${{ secrets.VAGALUME_API_KEY }}
          # V7/F16 — assinatura minisign do pacote de atualização. Sem estes
          # segredos o build FALHA (createUpdaterArtifacts está ligado): é de
          # propósito, uma release sem assinatura seria recusada pelo updater
          # de quem já tem o app instalado. Ver PRD-v7-atualizacao.md.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Cancioneiro ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            Instaladores do Cancioneiro — player offline com busca por letra e temas.

            - **Windows**: `.msi` ou `.exe` (SmartScreen: "Mais informações" → "Executar assim mesmo")
            - **macOS**: `.dmg` — `aarch64` para Apple Silicon (M1+), `x64` para Intel
              (primeira abertura: botão direito → "Abrir", app não assinado)
            - **Linux**: `.deb`, `.rpm` ou `.AppImage`

            A partir desta versão o Cancioneiro se atualiza sozinho: ao abrir,
            ele verifica se há versão nova, baixa em segundo plano e avisa para
            reiniciar quando estiver pronto (dá para desligar em Configurações).

            Guia de uso e curadoria do acervo: README.md do repositório.
          releaseDraft: false
          prerelease: false
          # publica o latest.json (manifesto lido pelo tauri-plugin-updater)
          includeUpdaterJson: true
          args: ${{ matrix.args }}
