name: acessorio-transcritor-metal

# V15.4 — o `whisper-cli` do Mac com Apple Silicon (M1 em diante), USANDO a
# placa de vídeo (Metal) e o Accelerate.
#
# O universal (`whisper-cli-macos-universal`) sai com os dois desligados: um
# binário só para Intel e ARM não compila o Metal. Relato de campo: a fila de
# 5.433 músicas num M2 estimava 117 horas. Este arquivo é ACRESCENTADO ao
# lançamento `acessorios-v1` com nome próprio, e o catálogo do app o oferece
# sob `macos-arm64`, que vem antes de `macos` na ordem desta máquina.
#
# E o universal de novo, para os Macs Intel: os dois publicados até a V15.3
# saíram exigindo o macOS 26 (o mínimo herdado do runner, porque ninguém o
# fixava), e quem tem sistema mais antigo — o caso comum de quem usa este app
# — não conseguia transcrever nada. Os dois agora fixam o macOS 12, e a
# build FALHA se o binário pedir mais que isso. Nomes novos (`macos12`), para
# não substituir o que já foi publicado.
#
# Fluxo SEPARADO de propósito: o `acessorio-transcritor.yml` reconstrói também
# o do Windows, que não é reprodutível, e rodá-lo troca a soma que o app
# espera (já aconteceu). Aqui nada além deste arquivo é tocado — e o upload
# RECUSA substituir um arquivo que já está publicado: trocar o binário depois
# de publicado quebraria a soma de quem já baixou.

on:
  workflow_dispatch:
    inputs:
      whisper:
        description: "Tag do whisper.cpp a construir"
        required: true
        default: "v1.7.4"
  push:
    paths:
      - ".github/workflows/acessorio-transcritor-metal.yml"

permissions:
  contents: write

env:
  TAG: acessorios-v1
  WHISPER: ${{ github.event.inputs.whisper || 'v1.7.4' }}
  MACOS_MINIMO: "12.0"

jobs:
  construir:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon: placa de vídeo (Metal, com os shaders DENTRO do
          # executável — sem isso ele procura um `.metal` ao lado e deixaria de
          # ser UM arquivo conferível por UM SHA-256) e Accelerate.
          - nome: whisper-cli-macos12-arm64-metal
            opcoes: >-
              -DCMAKE_OSX_ARCHITECTURES=arm64
              -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
              -DGGML_ACCELERATE=ON -DGGML_NATIVE=OFF
            arquiteturas: "arm64"
          # Intel e ARM num arquivo só: sem Metal/Accelerate, que não compilam
          # para os dois juntos (decisão 96). É o que os Macs Intel usam.
          - nome: whisper-cli-macos12-universal
            opcoes: >-
              "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
              -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_NATIVE=OFF
            arquiteturas: "arm64 x86_64"
    env:
      NOME: ${{ matrix.nome }}
    steps:
      - name: Já publicado? Então não há nada a fazer
        id: existe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
               -q '.assets[].name' | grep -qx "$NOME"; then
            echo "o $NOME já está no $TAG — não é substituído"
            echo "publicado=sim" >> "$GITHUB_OUTPUT"
          else
            echo "publicado=nao" >> "$GITHUB_OUTPUT"
          fi

      - name: Buscar o whisper.cpp
        if: steps.existe.outputs.publicado == 'nao'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$WHISPER" \
            https://github.com/ggml-org/whisper.cpp whisper

      - name: Construir
        if: steps.existe.outputs.publicado == 'nao'
        run: |
          set -euo pipefail
          cd whisper
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            "-DCMAKE_OSX_DEPLOYMENT_TARGET=$MACOS_MINIMO" \
            ${{ matrix.opcoes }} \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build build --config Release -j 4
          alvo=$(find build -type f -name whisper-cli -not -path '*/CMakeFiles/*' | sort | head -1)
          [ -n "$alvo" ] || { echo "::error::não achei o whisper-cli"; exit 1; }
          cp "$alvo" "../$NOME"
          chmod +x "../$NOME"

      - name: Conferir processadores, sistema mínimo e bibliotecas
        if: steps.existe.outputs.publicado == 'nao'
        run: |
          set -euo pipefail
          for arq in ${{ matrix.arquiteturas }}; do
            lipo -archs "$NOME" | tr ' ' '\n' | grep -qx "$arq" || {
              echo "::error::falta $arq"; exit 1; }
            minimo=$(vtool -arch "$arq" -show-build "$NOME" | awk '/minos/ {print $2}')
            echo "$arq: macOS mínimo $minimo"
            [ "$minimo" = "$MACOS_MINIMO" ] || {
              echo "::error::$arq pede macOS $minimo, e não $MACOS_MINIMO"; exit 1; }
          done
          otool -L "$NOME"
          # só as linhas de dependência (com tab); as de cabeçalho dizem o arquivo
          if otool -L "$NOME" | grep $'^\t' | grep -v -e '/System/' -e '/usr/lib/'; then
            echo "::error::o binário depende de biblioteca fora do sistema"; exit 1
          fi

      - name: Provar que transcreve
        if: steps.existe.outputs.publicado == 'nao'
        run: |
          set -euo pipefail
          # o runner é uma máquina VIRTUAL, sem placa de vídeo de verdade: aqui
          # se prova que funciona, não quanto é mais rápido (isso se mede num
          # Mac de verdade)
          curl -fsSL -o tiny.bin \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin"
          ./$NOME --model tiny.bin --file whisper/samples/jfk.wav --language en \
            --no-timestamps > saida.txt 2> saida.err
          cat saida.txt
          grep -qi "ask not" saida.txt || {
            echo "::error::a transcrição de prova saiu errada"; exit 1; }
          if [ "$NOME" = "whisper-cli-macos12-arm64-metal" ]; then
            grep -qi "ggml_metal_init" saida.err || {
              echo "::error::o Metal não foi iniciado"; exit 1; }
          fi
          {
            echo "### $NOME"
            echo "- sha256: \`$(shasum -a 256 "$NOME" | cut -d' ' -f1)\`"
            echo "- tamanho: $(stat -f%z "$NOME") bytes"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Publicar (sem substituir nada)
        if: steps.existe.outputs.publicado == 'nao'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "$NOME"
