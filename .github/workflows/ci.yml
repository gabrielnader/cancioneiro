name: ci

# push cobre PRs do mesmo repositório; sem gatilho pull_request para não
# executar a suíte duas vezes por PR
on:
  push:
    branches: ["**"]

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependências de sistema (Tauri + lame)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lame

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Python do tool-cache: evita o "externally managed environment"
      # (PEP 668) do Python de sistema do ubuntu-24.04
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências Python
        run: python3 -m pip install mutagen pytest

      - name: Dependências npm
        run: npm ci

      - name: Fixtures
        run: python3 tools/make_fixtures.py

      # As fixtures MP3 são um artefato COMPARTILHADO e MUTÁVEL: a suíte
      # Python roda o make_fixtures.py de novo (test_fixtures.py) e reescreve
      # fixtures/ do zero, enquanto a suíte Rust copia esses mesmos arquivos
      # para tempdirs. Encavalar as duas produzia falhas fantasmas em
      # enrich.rs ("failed to fill whole buffer") que somem ao rodar de novo —
      # o pior tipo de defeito para uma release automatizada.
      #
      # Aqui o Rust lê de um retrato tirado agora, que a suíte Python não
      # toca. Os testes Rust também sabem se defender sozinhos (ver
      # src-tauri/tests/common/mod.rs), mas depender só disso seria depender
      # de detecção; isto elimina a corrida por construção.
      - name: Retrato das fixtures para a suíte Rust
        run: |
          mkdir -p "$RUNNER_TEMP/fixtures-ci"
          cp fixtures/*.mp3 "$RUNNER_TEMP/fixtures-ci/"
          echo "CANCIONEIRO_FIXTURES_DIR=$RUNNER_TEMP/fixtures-ci" >> "$GITHUB_ENV"

      - name: Suíte completa (pytest + cargo + vitest com cobertura)
        run: npm run test:all

      - name: Navegador do Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E (Playwright)
        run: npm run test:e2e
