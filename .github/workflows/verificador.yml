name: verificador

# V15.8 — constrói o `verificar_acervo` (src-tauri/examples) para o Mac com
# Apple Silicon e o publica no lançamento `ferramentas`.
#
# É uma ferramenta de MEDIÇÃO para o dono do produto, e não parte do app: o
# aplicativo não o baixa nem o conhece. Por isso vai num lançamento próprio, e
# por isso pode ser substituído a cada build (nenhum catálogo espera a soma
# dele) — ao contrário dos acessórios.

on:
  workflow_dispatch:
  push:
    paths:
      - "src-tauri/examples/verificar_acervo.rs"
      - ".github/workflows/verificador.yml"

permissions:
  contents: write

jobs:
  construir:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # o `generate_context!` do app embute o frontend compilado: sem ele a
      # biblioteca nem compila, mesmo para um exemplo que não usa a janela
      - name: Frontend
        run: |
          npm ci
          npm run build

      - name: Construir
        working-directory: src-tauri
        env:
          MACOSX_DEPLOYMENT_TARGET: "12.0"
        run: |
          cargo build --release --example verificar_acervo
          cp target/release/examples/verificar_acervo ../verificar_acervo-macos-arm64
          ls -l ../verificar_acervo-macos-arm64

      - name: Publicar no lançamento `ferramentas`
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view ferramentas --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create ferramentas --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Ferramentas de medição" \
              --notes "Ferramentas para medir o acervo. Não fazem parte do aplicativo."
          gh release upload ferramentas --repo "$GITHUB_REPOSITORY" --clobber \
            verificar_acervo-macos-arm64
