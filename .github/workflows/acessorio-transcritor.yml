name: acessorio-transcritor

# Constrói o `whisper-cli` (whisper.cpp) para as quatro plataformas e o
# publica, junto do modelo, no MESMO lançamento `acessorios-v1`.
#
# Acrescentar arquivo a um lançamento existente NÃO muda o hash dos que já
# estão lá — quem já baixou o `fpcalc` não é afetado. É por isso que a tag é
# um espaço de nomes estável e não uma versão de cada arquivo (PRD V9).
#
# ATENÇÃO: este fluxo RECONSTRÓI os binários. O `whisper-cli` do Windows não
# é reprodutível (o MSVC carimba data e caminho), então rodá-lo troca a soma
# dele mesmo sem nenhuma mudança de código — e o catálogo do aplicativo passa
# a esperar um hash que o lançamento não serve mais. Já aconteceu uma vez.
# Para publicar SÓ um modelo, use o `acessorio-modelo.yml`.
#
# Por que construir em vez de rehospedar: o whisper.cpp não publica binário
# para as quatro plataformas. E `BUILD_SHARED_LIBS=OFF` é deliberado — com
# bibliotecas dinâmicas o Windows sairia com DLLs ao lado, e o acessório
# deixaria de ser UM arquivo conferível por UM SHA-256.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Lançamento de acessórios onde publicar"
        required: true
        default: "acessorios-v1"
      whisper:
        description: "Tag do whisper.cpp a construir"
        required: true
        default: "v1.7.4"
      modelo:
        description: "Modelo a rehospedar — NÃO use isto só para trocar de modelo"
        required: true
        default: "ggml-small-q5_1.bin"

permissions:
  contents: write

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          # UM trabalho de macOS, produzindo binário UNIVERSAL — não dois.
          #
          # O `macos-13` (Intel) fica eternamente na fila: três execuções deste
          # fluxo esperaram horas sem começar, e no teste de fumaça do `fpcalc`
          # ele foi o único dos quatro que nunca foi atendido. Runner que não
          # existe não é matriz, é impasse — e a fila dele travava os outros.
          #
          # `CMAKE_OSX_ARCHITECTURES` resolve no runner que existe, e o
          # resultado é um arquivo só para os dois processadores, igual ao
          # `fpcalc-macos-universal` que já publicamos. Menos arquivo, menos
          # hash, menos plataforma para explicar na tela.
          - so: macos-latest
            nome: whisper-cli-macos-universal
            arquiteturas: "arm64;x86_64"
          - so: ubuntu-24.04
            nome: whisper-cli-linux-x86_64
            arquiteturas: ""
          - so: windows-latest
            nome: whisper-cli-windows-x86_64.exe
            arquiteturas: ""
    runs-on: ${{ matrix.so }}
    steps:
      - name: Buscar o whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.inputs.whisper }}" \
            https://github.com/ggml-org/whisper.cpp whisper

      - name: Construir
        shell: bash
        run: |
          set -euo pipefail
          cd whisper
          extra=""
          if [ -n "${{ matrix.arquiteturas }}" ]; then
            # universal exige desligar a aceleração específica de processador:
            # o Accelerate/Metal do Apple Silicon não compila para x86_64 no
            # mesmo binário. Transcrição fica mais lenta e FUNCIONA nos dois —
            # e um binário que não roda em metade das máquinas é pior que um
            # binário lento (decisão 96).
            extra="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arquiteturas }}
                   -DGGML_METAL=OFF -DGGML_ACCELERATE=OFF -DGGML_NATIVE=OFF"
          fi
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON $extra
          cmake --build build --config Release -j 4

      - name: Conferir que o binário do macOS serve aos DOIS processadores
        if: startsWith(matrix.so, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          alvo=$(find whisper/build -type f -name whisper-cli | sort | head -1)
          file "$alvo"
          for arq in arm64 x86_64; do
            lipo -archs "$alvo" | tr ' ' '\n' | grep -qx "$arq" || {
              echo "::error::o binário não tem $arq — Macs $arq ficariam sem a etapa"
              exit 1; }
          done

      - name: Achar o executável (na ORDEM certa, que não é a do find)
        # O whisper.cpp deixa um `main` obsoleto ao lado do `whisper-cli`: ele
        # só imprime um aviso de depreciação e sai com erro. Um `find ... |
        # head -1` pega o que o sistema de arquivos devolver primeiro — no
        # macOS veio o certo, no Linux e no Windows veio o atalho, e a build
        # "falhou" por um motivo que não tinha nada a ver com o whisper.
        # Ordem explícita, do certo para o legado.
        shell: bash
        run: |
          set -euo pipefail
          encontrado=""
          for padrao in whisper-cli whisper-cli.exe main main.exe; do
            achado=$(find whisper/build -type f -name "$padrao" \
              -not -path '*/CMakeFiles/*' | sort | head -1)
            if [ -n "$achado" ]; then encontrado="$achado"; break; fi
          done
          if [ -z "$encontrado" ]; then
            echo "::error::não achei o executável do whisper.cpp"
            find whisper/build -type f -perm -u+x | head -40
            exit 1
          fi
          echo "encontrado: $encontrado"
          cp "$encontrado" "${{ matrix.nome }}"
          chmod +x "${{ matrix.nome }}" || true

      - name: Provar que EXECUTA aqui mesmo (decisão 96)
        # Vários programas de linha de comando imprimem a ajuda e saem com
        # código diferente de zero — o que prova é a SAÍDA falar de whisper,
        # não o código de retorno.
        shell: bash
        run: |
          set -uo pipefail
          saida=$(./${{ matrix.nome }} --help 2>&1 || true)
          printf '%s\n' "$saida" | head -5
          printf '%s' "$saida" | grep -qi 'whisper' || {
            echo "::error::o binário não se identifica como whisper"; exit 1; }
          printf '%s' "$saida" | grep -qi 'deprecated' && {
            echo "::error::isto é o atalho obsoleto, não o whisper-cli"; exit 1; }
          echo "ok"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.nome }}
          path: ${{ matrix.nome }}
          retention-days: 1

  publicar:
    needs: construir
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: baixados

      - name: Reunir os executáveis
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p saida
          find baixados -type f -name 'whisper-cli-*' -exec cp {} saida/ \;
          ls -l saida

      - name: Rehospedar o modelo
        # Rehospedado, e não apontado: URL que não muda e hash sob nosso
        # controle valem mais que 180 MB de tráfego quando não existe suporte.
        shell: bash
        env:
          MODELO: ${{ github.event.inputs.modelo }}
        run: |
          set -euo pipefail
          curl -fsSL -o "saida/$MODELO" \
            "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/$MODELO"
          ls -l "saida/$MODELO"

      - name: Somas de verificação
        shell: bash
        run: |
          set -euo pipefail
          cd saida && sha256sum * | tee ../SHA256SUMS-transcritor.txt

      - name: Publicar no lançamento de acessórios
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            saida/* SHA256SUMS-transcritor.txt

      - name: Resumo (é daqui que os hashes vão para o código)
        run: |
          {
            echo "## Transcritor publicado em \`${{ github.event.inputs.tag }}\`"
            echo
            echo "whisper.cpp \`${{ github.event.inputs.whisper }}\`, modelo \`${{ github.event.inputs.modelo }}\`"
            echo
            echo '```'
            cat SHA256SUMS-transcritor.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
