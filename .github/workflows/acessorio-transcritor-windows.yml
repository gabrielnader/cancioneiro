name: acessorio-transcritor-windows

# V16.11 — o `whisper-cli` do Windows sem depender do "Visual C++
# Redistributable". O de antes era montado com o runtime padrão do MSVC (/MD)
# e com OpenMP: precisava de MSVCP140, VCRUNTIME140, VCRUNTIME140_1 e VCOMP140,
# que vêm em muitos computadores, mas não em todos — e na máquina sem eles o
# programa não abre, e cada música terminava em erro. A máquina do GitHub tem
# o pacote, por isso a prova de "executa aqui" passava.
#
# Agora: runtime ESTÁTICO (/MT) e sem OpenMP (o ggml usa as próprias threads),
# e a montagem CONFERE que o executável não pede nenhuma dessas DLLs. Publicado
# com OUTRO nome, para não trocar a soma do arquivo que versões antigas do app
# conferem.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Lançamento de acessórios onde publicar"
        required: true
        default: "acessorios-v1"
      whisper:
        description: "Tag do whisper.cpp a construir"
        required: true
        default: "v1.7.4"

permissions:
  contents: write

# V16.12 — e SEM afinar para o processador da máquina do GitHub. O cmake do
# ggml liga GGML_NATIVE por padrão: o executável saía com instruções AVX-512,
# que a máquina do GitHub tem e a maioria dos notebooks não — e parava na
# primeira música ("não foi possível ouvir o áudio", 174 vezes). Duas versões:
# a comum (AVX2, quase todo computador de 2013 em diante) e a básica (sem AVX,
# para Celeron/Pentium simples). O app escolhe pelo processador.

jobs:
  construir:
    strategy:
      fail-fast: false
      matrix:
        include:
          - NOME: whisper-cli-windows-x86_64-avx2.exe
            instrucoes: "-DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON"
            proibido: "zmm"
            limite_ymm: "100000"
            limite_fma: "100000"
          - NOME: whisper-cli-windows-x86_64-basico.exe
            instrucoes: "-DGGML_AVX=OFF -DGGML_AVX2=OFF -DGGML_FMA=OFF -DGGML_F16C=OFF"
            # o runtime estático do MSVC traz ~220 instruções AVX (ymm, em
            # memcpy/memset) e ~110 FMA (nas funções matemáticas), usadas só
            # depois de conferir o processador. O ggml com AVX2 passaria de
            # 3.000 ymm: os limites separam um do outro
            proibido: "zmm"
            limite_ymm: "400"
            limite_fma: "200"
    runs-on: windows-latest
    env:
      NOME: ${{ matrix.NOME }}
    steps:
      - name: Buscar o whisper.cpp
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${{ github.event.inputs.whisper }}" \
            https://github.com/ggml-org/whisper.cpp whisper

      - name: Construir (runtime estático, sem OpenMP)
        shell: bash
        run: |
          set -euo pipefail
          cd whisper
          cmake -B build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_SERVER=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF -DGGML_AVX512=OFF ${{ matrix.instrucoes }} \
            -DCMAKE_POLICY_DEFAULT_CMP0091=NEW \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build build --config Release -j 4

      - name: Achar o executável
        shell: bash
        run: |
          set -euo pipefail
          achado=$(find whisper/build -type f -name whisper-cli.exe -not -path '*/CMakeFiles/*' | sort | head -1)
          [ -n "$achado" ] || { echo "::error::não achei o whisper-cli.exe"; exit 1; }
          cp "$achado" "$NOME"
          ls -l "$NOME"

      - name: Conferir que não pede o pacote da Microsoft
        shell: bash
        run: |
          set -euo pipefail
          python - "$NOME" <<'PY'
          import re, sys
          b = open(sys.argv[1], "rb").read()
          dlls = sorted({m.decode().lower() for m in re.findall(rb"[A-Za-z0-9_\-]+\.dll", b, re.I)})
          print("DLLs citadas:", dlls)
          proibidas = [d for d in dlls if re.match(r"(msvcp|vcruntime|vcomp)\d+", d)]
          if proibidas:
              print(f"::error::ainda depende do Visual C++ Redistributable: {proibidas}")
              sys.exit(1)
          PY

      - name: Conferir as instruções do processador
        # o que o executável usa tem de existir no computador da pessoa, e não
        # só na máquina do GitHub: AVX-512 (zmm) nunca; na básica, nem AVX (ymm)
        shell: bash
        run: |
          set -euo pipefail
          # objdump (do MinGW/Strawberry) ou o llvm-objdump do LLVM, o que a
          # máquina do GitHub tiver
          ferramenta=$(command -v objdump || command -v llvm-objdump || echo "/c/Program Files/LLVM/bin/llvm-objdump.exe")
          "$ferramenta" -d "$NOME" > desmontado.txt
          [ "$(wc -l < desmontado.txt)" -gt 1000 ] || { echo "::error::não deu para desmontar o executável"; exit 1; }
          n=$(grep -Ec "${{ matrix.proibido }}" desmontado.txt || true)
          echo "instruções proibidas encontradas: $n"
          [ "$n" = "0" ] || { echo "::error::o executável usa instruções que muitos processadores não têm"; exit 1; }
          y=$(grep -c "ymm" desmontado.txt || true)
          echo "instruções AVX (ymm): $y (limite ${{ matrix.limite_ymm }})"
          [ "$y" -le "${{ matrix.limite_ymm }}" ] || { echo "::error::AVX demais para a versão básica"; exit 1; }
          f=$(grep -Ec "vfmadd|vfmsub|vfnmadd" desmontado.txt || true)
          echo "instruções FMA: $f (limite ${{ matrix.limite_fma }})"
          [ "$f" -le "${{ matrix.limite_fma }}" ] || { echo "::error::FMA demais para a versão básica"; exit 1; }

      - name: Provar que EXECUTA aqui mesmo
        shell: bash
        run: |
          set -uo pipefail
          saida=$(./$NOME --help 2>&1 || true)
          printf '%s\n' "$saida" | head -5
          printf '%s' "$saida" | grep -qi 'whisper' || {
            echo "::error::o binário não se identifica como whisper"; exit 1; }
          echo "ok"

      - name: Somas de verificação
        shell: bash
        run: sha256sum "$NOME" | tee "SHA256SUMS-$NOME.txt"

      - name: Publicar no lançamento de acessórios
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "$NOME" "SHA256SUMS-$NOME.txt"

      - name: Resumo (é daqui que o hash vai para o código)
        shell: bash
        run: |
          {
            echo "## $NOME em \`${{ github.event.inputs.tag }}\`"
            echo '```'
            cat "SHA256SUMS-$NOME.txt"
            stat -c '%s bytes' "$NOME" 2>/dev/null || wc -c < "$NOME"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
